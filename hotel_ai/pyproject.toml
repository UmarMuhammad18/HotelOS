[project]
name = "hotel-ai"
version = "0.5.0"
description = "HotelOS AI Advisor — multi-agent hotel operations intelligence"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Correctness-first so CI stays green while we incrementally adopt
# stricter style rules (I/UP/B) across the codebase.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
]
ignore = [
    "E501",  # line length (formatter)
    "E722",  # bare except in legacy helpers
    "F841",  # unused local — gradual cleanup
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
