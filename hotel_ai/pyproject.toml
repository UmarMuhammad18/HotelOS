[project]
name = "hotel-ai"
version = "0.5.0"
description = "HotelOS AI Advisor — multi-agent hotel operations intelligence"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
# Start with correctness rules so CI is green; expand to I/UP/B as the
# codebase is cleaned up incrementally.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
]
ignore = [
    "E501",  # line length (handled by formatter)
    "E722",  # bare except — cleaned in app/memory.py; keep ignored for legacy
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
